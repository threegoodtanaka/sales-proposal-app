<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>田中祐貴の分身エージェント</title>
  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
      background:#f7f7f8; height:100vh; display:flex; flex-direction:column;
      color:#0d0d0d;
    }

    /* ── ヘッダー ── */
    header{
      background:#171717; color:#fff;
      padding:12px 20px; display:flex; align-items:center; gap:12px;
      flex-shrink:0; z-index:10;
    }
    .avatar{
      width:34px;height:34px;border-radius:50%;
      background:linear-gradient(135deg,#10a37f,#1a7f64);
      display:flex;align-items:center;justify-content:center;
      font-size:16px;font-weight:bold;color:#fff;flex-shrink:0;
    }
    header h1{font-size:15px;font-weight:600;}
    header p{font-size:11px;color:#aaa;margin-top:1px;}
    .status{
      margin-left:auto;font-size:12px;color:#10a37f;
      display:flex;align-items:center;gap:5px;
    }
    .status::before{
      content:"";width:7px;height:7px;border-radius:50%;background:#10a37f;
    }

    /* ── レイアウト ── */
    .layout{display:flex;flex:1;overflow:hidden;}

    /* ── サイドバー ── */
    .sidebar{
      width:240px;min-width:240px;background:#171717;color:#ececec;
      display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
    }
    .sidebar-section{
      padding:12px;font-size:11px;color:#888;text-transform:uppercase;
      letter-spacing:.06em;border-bottom:1px solid rgba(255,255,255,.07);
    }
    .preset-list{flex:1;overflow-y:auto;padding:6px;}
    .preset-item{
      padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;
      transition:background .15s;color:#d4d4d4;
    }
    .preset-item:hover{background:rgba(255,255,255,.07);}
    .preset-item.active{background:rgba(16,163,127,.25);color:#fff;}

    /* ── メインエリア ── */
    .main{display:flex;flex-direction:column;flex:1;overflow:hidden;}

    /* チャット */
    #chat{flex:1;overflow-y:auto;padding:20px 0;}
    .msg{max-width:780px;margin:0 auto;padding:6px 20px;display:flex;gap:12px;align-items:flex-start;}
    .msg.user{flex-direction:row-reverse;}
    .icon{
      width:30px;height:30px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;
    }
    .user .icon{background:#5865f2;color:#fff;}
    .agent .icon{background:linear-gradient(135deg,#10a37f,#1a7f64);color:#fff;}
    .bubble{
      background:#fff;border-radius:10px;padding:11px 14px;font-size:13.5px;
      line-height:1.75;box-shadow:0 1px 3px rgba(0,0,0,.07);
      max-width:calc(100% - 52px);white-space:pre-wrap;word-break:break-word;
    }
    .user .bubble{background:#5865f2;color:#fff;}
    .typing .bubble{display:flex;gap:5px;align-items:center;padding:14px;}
    .dot{width:7px;height:7px;border-radius:50%;background:#aaa;animation:blink 1.2s infinite;}
    .dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
    @keyframes blink{0%,80%,100%{opacity:.3;transform:scale(.9);}40%{opacity:1;transform:scale(1.1);}}

    /* ── 下部パネル ── */
    .bottom{
      border-top:1px solid #e5e5e5;background:#fff;flex-shrink:0;
    }

    /* コンテキストパネル（折りたたみ） */
    .ctx-toggle{
      width:100%;padding:8px 20px;background:#f9fafb;border:none;
      border-bottom:1px solid #e5e5e5;cursor:pointer;
      display:flex;align-items:center;gap:8px;font-size:12px;color:#555;
      text-align:left;
    }
    .ctx-toggle:hover{background:#f0f0f0;}
    .ctx-toggle .arrow{font-size:10px;transition:transform .2s;}
    .ctx-toggle.open .arrow{transform:rotate(180deg);}
    .ctx-badge{
      background:#10a37f;color:#fff;border-radius:20px;
      padding:1px 7px;font-size:11px;margin-left:auto;
    }

    .ctx-panel{
      display:none;padding:12px 20px;background:#f9fafb;
      border-bottom:1px solid #e5e5e5;
      gap:12px;flex-direction:column;
    }
    .ctx-panel.open{display:flex;}

    .ctx-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;}
    .ctx-col{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px;}
    .ctx-label{font-size:11px;color:#777;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}

    /* プロンプト編集 */
    #preset-prompt{
      width:100%;border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;
      font-size:12.5px;font-family:inherit;resize:vertical;min-height:72px;
      max-height:200px;outline:none;background:#fff;color:#111;
    }
    #preset-prompt:focus{border-color:#10a37f;}

    /* ファイルアップロード */
    .upload-zone{
      border:2px dashed #d1d5db;border-radius:8px;padding:14px 10px;
      text-align:center;cursor:pointer;font-size:12px;color:#999;
      transition:border-color .15s,background .15s;
    }
    .upload-zone:hover,.upload-zone.drag{border-color:#10a37f;background:#f0faf7;color:#10a37f;}
    #file-input{display:none;}

    /* URL入力 */
    .url-row{display:flex;gap:6px;}
    #url-input{
      flex:1;border:1px solid #d1d5db;border-radius:8px;padding:7px 10px;
      font-size:12.5px;outline:none;
    }
    #url-input:focus{border-color:#10a37f;}
    .url-add-btn{
      background:#10a37f;color:#fff;border:none;border-radius:8px;
      padding:7px 14px;font-size:12px;cursor:pointer;white-space:nowrap;
    }
    .url-add-btn:hover{background:#0d8f6e;}

    /* コンテキストチップ */
    .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
    .chip{
      background:#e8f5f1;border:1px solid #b2dfd0;color:#0d6b50;
      border-radius:20px;padding:3px 10px;font-size:11.5px;
      display:flex;align-items:center;gap:5px;
    }
    .chip .remove{
      cursor:pointer;color:#999;font-size:13px;line-height:1;
      transition:color .1s;
    }
    .chip .remove:hover{color:#e00;}

    /* 入力エリア */
    .input-wrap{
      max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;
      padding:12px 20px;
    }
    #user-input{
      flex:1;border:1px solid #d1d5db;border-radius:10px;
      padding:9px 13px;font-size:13.5px;font-family:inherit;
      resize:none;outline:none;max-height:160px;line-height:1.5;
      transition:border-color .15s;
    }
    #user-input:focus{border-color:#10a37f;}
    #send-btn{
      background:#10a37f;color:#fff;border:none;border-radius:10px;
      padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;
      transition:background .15s;white-space:nowrap;
    }
    #send-btn:hover:not(:disabled){background:#0d8f6e;}
    #send-btn:disabled{background:#ccc;cursor:not-allowed;}

    /* 例タグ */
    .examples{
      max-width:780px;margin:0 auto 4px;padding:0 20px;
      display:flex;flex-wrap:wrap;gap:5px;
    }
    .eg{
      background:#f0faf6;border:1px solid #b2e5d4;color:#0d6b50;
      border-radius:20px;padding:3px 11px;font-size:11.5px;cursor:pointer;
    }
    .eg:hover{background:#d4f5e9;}
  </style>
</head>
<body>

<header>
  <div class="avatar">T</div>
  <div>
    <h1>田中祐貴の分身エージェント</h1>
    <p>株式会社スリーグッド — 営業代行AIエージェント</p>
  </div>
  <div class="status">オンライン</div>
</header>

<div class="layout">

  <!-- サイドバー：プリセット一覧 -->
  <div class="sidebar">
    <div class="sidebar-section">モード選択</div>
    <div class="preset-list" id="preset-list">
      <div class="preset-item active" data-id="" data-prompt="">すべて（デフォルト）</div>
    </div>
  </div>

  <!-- メインエリア -->
  <div class="main">
    <div id="chat"></div>

    <div class="bottom">

      <!-- コンテキストパネル（折りたたみ） -->
      <button class="ctx-toggle" id="ctx-toggle" onclick="toggleCtx()">
        <span class="arrow">▲</span>
        <span>参考資料・プロンプト設定</span>
        <span class="ctx-badge" id="ctx-badge" style="display:none">0</span>
      </button>
      <div class="ctx-panel" id="ctx-panel">

        <div class="ctx-row">
          <!-- プロンプト編集 -->
          <div class="ctx-col" style="flex:2;">
            <div class="ctx-label">モード別プロンプト（編集可）</div>
            <textarea id="preset-prompt" placeholder="選択したモードのプロンプトが表示されます。自由に編集できます。"></textarea>
          </div>

          <!-- ファイル＆URL -->
          <div class="ctx-col">
            <div class="ctx-label">参考ファイル（PDF / Word / Excel / CSV）</div>
            <div class="upload-zone" id="upload-zone"
              onclick="document.getElementById('file-input').click()"
              ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
              クリックまたはドラッグ＆ドロップ
            </div>
            <input type="file" id="file-input" multiple
              accept=".pdf,.docx,.xlsx,.xls,.txt,.md,.csv"
              onchange="onFileSelect(event)">

            <div class="ctx-label" style="margin-top:8px;">参考URL</div>
            <div class="url-row">
              <input type="url" id="url-input" placeholder="https://...">
              <button class="url-add-btn" onclick="addUrl()">追加</button>
            </div>

            <div class="chips" id="ctx-chips"></div>
          </div>
        </div>

      </div>

      <!-- 例タグ -->
      <div class="examples">
        <span class="eg" onclick="fillEx(this)">〇〇社への提案書を作成して</span>
        <span class="eg" onclick="fillEx(this)">飲食業向けXポスト文を5本作って</span>
        <span class="eg" onclick="fillEx(this)">HR Tech業界をリサーチしてレポートを出して</span>
        <span class="eg" onclick="fillEx(this)">架電リストCSVの重複を排除して整理して</span>
        <span class="eg" onclick="fillEx(this)">今月の定例MTG集計資料を作って</span>
        <span class="eg" onclick="fillEx(this)">スリーグッドのプレスリリースを書いて</span>
      </div>

      <div class="input-wrap">
        <textarea id="user-input" rows="1"
          placeholder="タスクを入力してください（例: 〇〇社への提案書を作成して）"></textarea>
        <button id="send-btn" onclick="sendMessage()">送信</button>
      </div>

    </div><!-- /.bottom -->
  </div><!-- /.main -->
</div><!-- /.layout -->

<script>
// ── 状態 ────────────────────────────────────────────
const chatEl   = document.getElementById('chat');
const inputEl  = document.getElementById('user-input');
const sendBtn  = document.getElementById('send-btn');
let   busy     = false;

// コンテキスト: { id, type:'file'|'url', name, text }[]
let ctxItems = [];

// ── テキストエリア自動リサイズ ──
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── 例タグ ──
function fillEx(el){ inputEl.value = el.textContent; inputEl.focus(); inputEl.dispatchEvent(new Event('input')); }

// ── コンテキストパネル折りたたみ ──
function toggleCtx(){
  const panel  = document.getElementById('ctx-panel');
  const toggle = document.getElementById('ctx-toggle');
  panel.classList.toggle('open');
  toggle.classList.toggle('open');
}

// ── プリセット読み込み ──
async function loadPresets(){
  try{
    const res   = await fetch('/api/presets');
    const data  = await res.json();
    const list  = document.getElementById('preset-list');
    list.innerHTML = '<div class="preset-item active" data-id="" data-prompt="">すべて（デフォルト）</div>';
    for(const p of (data.presets||[])){
      if(p.id === 'default') continue;
      const el = document.createElement('div');
      el.className   = 'preset-item';
      el.dataset.id  = p.id;
      el.dataset.prompt = p.prompt || '';
      el.textContent = p.name;
      list.appendChild(el);
    }
    list.querySelectorAll('.preset-item').forEach(el => {
      el.addEventListener('click', () => selectPreset(el));
    });
  }catch(e){ console.error(e); }
}

function selectPreset(el){
  document.querySelectorAll('.preset-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('preset-prompt').value = el.dataset.prompt || '';
  // パネルを開く
  const panel  = document.getElementById('ctx-panel');
  const toggle = document.getElementById('ctx-toggle');
  panel.classList.add('open');
  toggle.classList.add('open');
}

// ── ファイルアップロード ──
function onDragOver(e){ e.preventDefault(); document.getElementById('upload-zone').classList.add('drag'); }
function onDragLeave(){ document.getElementById('upload-zone').classList.remove('drag'); }
function onDrop(e){
  e.preventDefault();
  onDragLeave();
  handleFiles(e.dataTransfer.files);
}
function onFileSelect(e){ handleFiles(e.target.files); e.target.value=''; }

async function handleFiles(files){
  for(const file of files){
    const formData = new FormData();
    formData.append('file', file);
    try{
      const res  = await fetch('/api/upload', {method:'POST', body:formData});
      const data = await res.json();
      if(data.error){ alert(data.error); continue; }
      const id = Date.now() + '_' + Math.random();
      ctxItems.push({ id, type:'file', name:data.name, text:data.text });
      renderChips();
    }catch(e){ alert('アップロードエラー: '+e.message); }
  }
}

// ── URL追加 ──
async function addUrl(){
  const urlEl = document.getElementById('url-input');
  const url   = urlEl.value.trim();
  if(!url){ return; }
  urlEl.value = '';
  const res  = await fetch('/api/fetch-url', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({url})
  });
  const data = await res.json();
  if(data.error){ alert(data.error); return; }
  const id = Date.now()+'_'+Math.random();
  ctxItems.push({id, type:'url', name:url, text:data.text});
  renderChips();
}

document.getElementById('url-input').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); addUrl(); }
});

// ── チップ描画 ──
function renderChips(){
  const cont  = document.getElementById('ctx-chips');
  const badge = document.getElementById('ctx-badge');
  cont.innerHTML = '';
  for(const item of ctxItems){
    const chip = document.createElement('div');
    chip.className = 'chip';
    const icon = item.type === 'file' ? '📄' : '🔗';
    const label = item.type === 'url'
      ? item.name.replace(/^https?:\/\//,'').substring(0,40)
      : item.name;
    chip.innerHTML = `${icon} ${label} <span class="remove" onclick="removeCtx('${item.id}')">✕</span>`;
    cont.appendChild(chip);
  }
  if(ctxItems.length > 0){
    badge.style.display = '';
    badge.textContent   = ctxItems.length;
  } else {
    badge.style.display = 'none';
  }
}

function removeCtx(id){
  ctxItems = ctxItems.filter(c => c.id !== id);
  renderChips();
}

// ── チャット送信 ──
function addMsg(role, text){
  const wrap   = document.createElement('div');
  wrap.className = `msg ${role}`;
  const icon   = document.createElement('div');
  icon.className = 'icon';
  icon.textContent = role === 'user' ? 'Y' : 'AI';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(icon);
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bubble;
}

function addTyping(){
  const wrap = document.createElement('div');
  wrap.className = 'msg agent typing';
  wrap.id = 'typing';
  wrap.innerHTML = `<div class="icon">AI</div><div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function removeTyping(){ const el=document.getElementById('typing'); if(el) el.remove(); }

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text || busy) return;

  busy = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  addMsg('user', text);
  addTyping();

  // コンテキスト構築
  const presetPrompt = document.getElementById('preset-prompt').value.trim();
  const ragContext   = ctxItems.map(c =>
    `=== ${c.type === 'file' ? 'ファイル' : 'URL'}: ${c.name} ===\n${c.text}`
  ).join('\n\n');

  let agentBubble = null;
  let agentText   = '';

  try{
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message:text, preset_prompt:presetPrompt, rag_context:ragContext }),
    });

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let   buf     = '';

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if(raw === '[DONE]') break;
        try{
          const obj = JSON.parse(raw);
          if(obj.text){
            agentText += obj.text;
            removeTyping();
            if(!agentBubble) agentBubble = addMsg('agent', agentText);
            else agentBubble.textContent = agentText;
            chatEl.scrollTop = chatEl.scrollHeight;
          }
          if(obj.error){ removeTyping(); addMsg('agent','❌ エラー: '+obj.error); }
        }catch(_){}
      }
    }
    removeTyping();
  }catch(err){
    removeTyping();
    addMsg('agent','❌ 通信エラー: '+err.message);
  }finally{
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

// ── 初期化 ──
loadPresets();
</script>
</body>
</html>
