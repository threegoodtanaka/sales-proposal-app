<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slack RAG</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            background: #f7f7f8;
            color: #0d0d0d;
        }

        /* サイドバー */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: #171717;
            color: #ececec;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding: 16px 12px;
            gap: 8px;
        }
        .sidebar-title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            padding: 4px 4px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-title span { font-size: 20px; }
        .sidebar-nav a {
            display: block;
            padding: 10px 12px;
            border-radius: 8px;
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            font-size: 14px;
            transition: background 0.15s;
        }
        .sidebar-nav a:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .sidebar-nav a.active { background: rgba(255,255,255,0.13); color: #fff; font-weight: 600; }

        .sidebar-section {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar-section-label {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0 12px 6px;
        }

        /* メインエリア */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .main-header {
            padding: 18px 28px 14px;
            border-bottom: 1px solid #e5e5e5;
            background: #fff;
        }
        .main-header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .main-header p {
            margin: 4px 0 0;
            font-size: 13px;
            color: #666;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* カード */
        .card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
            padding: 20px 24px;
        }
        .card-title {
            font-size: 14px;
            font-weight: 700;
            margin: 0 0 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #111;
        }
        .card-title .badge {
            font-size: 11px;
            font-weight: 600;
            background: #f0f0f0;
            color: #555;
            padding: 2px 8px;
            border-radius: 20px;
        }

        /* ステップ行 */
        .steps {
            display: flex;
            gap: 12px;
            align-items: stretch;
            flex-wrap: wrap;
        }
        .step {
            flex: 1;
            min-width: 200px;
            background: #f9f9f9;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .step-num {
            width: 24px;
            height: 24px;
            background: #171717;
            color: #fff;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .step-label { font-size: 13px; font-weight: 600; color: #222; }
        .step-desc { font-size: 12px; color: #777; }

        /* ボタン */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }
        .btn-primary { background: #171717; color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #333; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover:not(:disabled) { background: #e0e0e0; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        /* ステータス表示 */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 4px;
            min-height: 36px;
        }
        .status-bar.idle { background: #f5f5f5; color: #888; }
        .status-bar.loading { background: #fff8e6; color: #b45309; }
        .status-bar.success { background: #f0fdf4; color: #166534; }
        .status-bar.error { background: #fef2f2; color: #991b1b; }
        .spinner {
            width: 14px; height: 14px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 質問エリア */
        .query-row {
            display: flex;
            gap: 8px;
        }
        .query-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        .query-input:focus { border-color: #171717; }

        /* 回答エリア */
        .answer-box {
            background: #f9f9f9;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 16px;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            min-height: 60px;
            color: #222;
        }
        .answer-box.empty { color: #aaa; font-style: italic; }

        /* ソース一覧 */
        .sources-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }
        .source-item {
            background: #f9f9f9;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
        }
        .source-meta {
            display: flex;
            gap: 12px;
            color: #888;
            margin-bottom: 4px;
            font-size: 11px;
        }
        .source-score { color: #166534; font-weight: 600; }
        .source-text { color: #333; line-height: 1.5; }
    </style>
</head>
<body>

<!-- サイドバー -->
<nav class="sidebar">
    <div class="sidebar-title">
        <span>🤖</span> スリーグッド AI
    </div>
    <div class="sidebar-nav">
        <a href="/">💬 チャット</a>
        <a href="/slack_rag" class="active">🔍 Slack RAG</a>
    </div>
    <div class="sidebar-section">
        <div class="sidebar-section-label">使い方</div>
        <div style="padding: 8px 12px; font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.6;">
            1. Slackデータを取得<br>
            2. ベクトルDBを構築<br>
            3. 質問して回答を得る
        </div>
    </div>
</nav>

<!-- メイン -->
<div class="main">
    <div class="main-header">
        <h1>🔍 Slack RAG 検索</h1>
        <p>Slackの会話履歴をAIで検索・回答します</p>
    </div>

    <div class="content">

        <!-- STEP 1 & 2: データ準備 -->
        <div class="card">
            <div class="card-title">
                データ準備
                <span class="badge">初回 or 更新時に実行</span>
            </div>
            <div class="steps">
                <!-- STEP 1 -->
                <div class="step">
                    <div class="step-num">1</div>
                    <div class="step-label">Slackデータ取得</div>
                    <div class="step-desc">指定チャンネルの履歴をDBに保存します</div>
                    <button class="btn btn-primary btn-sm" id="fetchBtn" onclick="fetchMessages()">
                        取得する
                    </button>
                    <div class="status-bar idle" id="fetchStatus">待機中</div>
                </div>
                <!-- STEP 2 -->
                <div class="step">
                    <div class="step-num">2</div>
                    <div class="step-label">ベクトルDB構築</div>
                    <div class="step-desc">取得したメッセージをAI検索用に変換します</div>
                    <button class="btn btn-primary btn-sm" id="buildBtn" onclick="buildVectorStore()">
                        構築する
                    </button>
                    <div class="status-bar idle" id="buildStatus">待機中</div>
                </div>
            </div>
        </div>

        <!-- STEP 3: 質問 -->
        <div class="card">
            <div class="card-title">
                質問する
                <span class="badge">STEP 3</span>
            </div>
            <div class="query-row">
                <input
                    type="text"
                    class="query-input"
                    id="questionInput"
                    placeholder="例: 先週のMTGで決まったことは？"
                    onkeydown="if(event.key==='Enter') submitQuery()"
                />
                <button class="btn btn-primary" id="queryBtn" onclick="submitQuery()">
                    送信
                </button>
            </div>
            <div class="status-bar idle" id="queryStatus" style="margin-top: 10px;">待機中</div>
        </div>

        <!-- 回答 -->
        <div class="card" id="answerCard" style="display:none;">
            <div class="card-title">💡 回答</div>
            <div class="answer-box" id="answerBox"></div>
        </div>

        <!-- 参照メッセージ -->
        <div class="card" id="sourcesCard" style="display:none;">
            <div class="card-title">📋 参照したSlackメッセージ</div>
            <div class="sources-list" id="sourcesList"></div>
        </div>

    </div>
</div>

<script>
    // ---- ユーティリティ ----
    function setStatus(id, type, msg, spinner=false) {
        const el = document.getElementById(id);
        el.className = `status-bar ${type}`;
        el.innerHTML = spinner
            ? `<div class="spinner"></div>${msg}`
            : msg;
    }

    // ---- STEP 1: Slackデータ取得 ----
    async function fetchMessages() {
        const btn = document.getElementById('fetchBtn');
        btn.disabled = true;
        setStatus('fetchStatus', 'loading', '取得中...', true);
        try {
            const res = await fetch('/slack_rag_fetch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({limit: 200})
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            setStatus('fetchStatus', 'success',
                `✅ 新規 ${data.saved} 件保存 / DB合計 ${data.total} 件`);
        } catch(e) {
            setStatus('fetchStatus', 'error', `❌ ${e.message}`);
        } finally {
            btn.disabled = false;
        }
    }

    // ---- STEP 2: ベクトルDB構築 ----
    async function buildVectorStore() {
        const btn = document.getElementById('buildBtn');
        btn.disabled = true;
        setStatus('buildStatus', 'loading', '構築中（少し時間がかかります）...', true);
        try {
            const res = await fetch('/slack_rag_build', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({reset: false})
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            setStatus('buildStatus', 'success',
                `✅ ${data.upserted} 件をベクトル化しました`);
        } catch(e) {
            setStatus('buildStatus', 'error', `❌ ${e.message}`);
        } finally {
            btn.disabled = false;
        }
    }

    // ---- STEP 3: 質問 ----
    async function submitQuery() {
        const question = document.getElementById('questionInput').value.trim();
        if (!question) return;

        const btn = document.getElementById('queryBtn');
        btn.disabled = true;
        document.getElementById('answerCard').style.display = 'none';
        document.getElementById('sourcesCard').style.display = 'none';
        setStatus('queryStatus', 'loading', '回答を生成中...', true);

        try {
            const res = await fetch('/slack_rag_query', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question, top_k: 8})
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error);

            // 回答を表示
            const answerBox = document.getElementById('answerBox');
            answerBox.textContent = data.answer;
            document.getElementById('answerCard').style.display = 'block';

            // 参照メッセージを表示
            if (data.sources && data.sources.length > 0) {
                const list = document.getElementById('sourcesList');
                list.innerHTML = data.sources.map((s, i) => `
                    <div class="source-item">
                        <div class="source-meta">
                            <span class="source-score">類似度 ${s.score}</span>
                            <span>📢 #${s.channel_name || s.channel_id || '不明'}</span>
                            <span>👤 ${s.user_name || s.user || '不明'}</span>
                            <span>🕐 ${s.datetime ? s.datetime.slice(0,16).replace('T',' ') : ''}</span>
                        </div>
                        <div class="source-text">${escapeHtml(s.text)}</div>
                    </div>
                `).join('');
                document.getElementById('sourcesCard').style.display = 'block';
            }

            setStatus('queryStatus', 'success', `✅ 回答を生成しました（参照 ${data.sources.length} 件）`);
        } catch(e) {
            setStatus('queryStatus', 'error', `❌ ${e.message}`);
        } finally {
            btn.disabled = false;
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
</script>
</body>
</html>
