# ============================================================
# 問合せフォーム営業ツール 設定ファイル
# ============================================================

# ── 送信者情報（フォームに入力する情報） ──────────────────
sender:
  company_name: "株式会社ポスタス"          # 自社名
  department: "営業部"                        # 部署名
  name: "担当者名"                            # 氏名
  email: "info@example.com"                   # メールアドレス
  phone: "03-0000-0000"                       # 電話番号
  url: "https://example.com"                  # 自社URL（任意）

# ── 自社サービス情報（Claudeがメッセージ生成に使用） ────────
service:
  name: "セルフオーダーシステム（タブレットPOS）"
  summary: |
    飲食店向けのタブレット型セルフオーダー・POSシステムです。
    QRコードメニューとタブレット注文の両方に対応し、
    年4回の機能アップデートで常に最新機能を提供しています。
  key_benefits:
    - 注文ミス・呼び出し対応の削減でホール人件費を削減
    - キャッシュレス・多言語対応（英語・中国語・韓国語）
    - 月額制で初期費用を抑えた導入が可能
    - 導入後の手厚いサポート体制（専任担当者）
    - 年4回のアップデートで常に最新機能
  target_industries:
    - 飲食店
    - レストラン
    - 居酒屋
    - カフェ
    - ファミリーレストラン

# ── 訴求の切り口（ローテーションで使用） ───────────────────
appeal_angles:
  - id: "human_cost"
    label: "人件費・人手不足"
    description: "人手不足・採用難の解消、ホール人員の削減コスト"

  - id: "customer_experience"
    label: "顧客体験向上"
    description: "注文待ち時間ゼロ・ミスゼロで顧客満足度向上、リピーター獲得"

  - id: "revenue_up"
    label: "売上・客単価アップ"
    description: "視覚的メニューで追加注文促進、ドリンク・サイドメニューの売上アップ"

  - id: "multilingual"
    label: "インバウンド・多言語対応"
    description: "外国人観光客への対応、多言語メニューで機会損失を防止"

  - id: "cost_reduction"
    label: "コスト削減・DX化"
    description: "月額制で低初期費用、紙メニュー印刷コスト削減、業務デジタル化"

# ── 警告検出キーワード（これらが検出された場合はスキップ） ──
skip_keywords:
  - "営業お断り"
  - "セールスお断り"
  - "営業を目的"
  - "営業目的"
  - "勧誘目的"
  - "広告・宣伝を目的"
  - "広告宣伝を目的"
  - "営業活動を目的"
  - "セールス目的"
  - "営業に関するお問い合わせはお断り"
  - "取材・営業"
  - "営業電話"
  - "万円請求"
  - "有料となります"
  - "料金が発生"
  - "費用を請求"
  - "ご遠慮ください"        # 「営業はご遠慮ください」等
  - "お断りしております"

# ── 動作設定 ─────────────────────────────────────────────
settings:
  ai_provider: "anthropic"   # "anthropic"（Claude）または "openai"（GPT-4o）
  dry_run: true              # true=送信しない（テストモード）/ false=実際に送信
  headless: true             # true=ブラウザ非表示 / false=ブラウザ表示（確認用）
  wait_between_seconds: 10   # 送信間隔（秒）※サーバー負荷軽減
  page_load_timeout: 30      # ページ読み込みタイムアウト（秒）
  form_fill_delay: 0.5       # フォーム入力間の待機（秒）
  max_retries: 2             # エラー時のリトライ回数
  output_csv: "results.csv"  # 結果出力ファイル名
